<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhumMai - Admin Real-time Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

        body.pastel-theme {
            background: linear-gradient(135deg, #ffb199 0%, #ff0844 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }

        /* ขยายกล่องหลักให้เป็นแนวนอนกว้างเต็มตา */
        .admin-container-horizontal {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 35px 30px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 1100px;
            width: 95%;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .admin-title {
            color: #2d3748;
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        /* จัดเรียงการ์ดสถิติเป็นแนวนอน 3 คอลัมน์ */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #ffffff;
            padding: 20px 15px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-left: 6px solid #3b82f6;
            text-align: center;
        }

        .stat-card.mobile { border-left-color: #ec4899; }
        .stat-card.desktop { border-left-color: #10b981; }

        .stat-title {
            font-size: 15px;
            color: #4a5568;
            font-weight: 500;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 600;
            color: #1e293b;
            margin: 8px 0;
        }

        .stat-percent {
            font-size: 13px;
            color: #718096;
        }

        /* แถบกราฟเปอร์เซ็นต์ */
        .progress-bar-bg {
            background: #e2e8f0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
            display: flex;
        }

        .progress-mobile { background: #ec4899; height: 100%; transition: width 0.4s ease; }
        .progress-desktop { background: #10b981; height: 100%; transition: width 0.4s ease; }

        /* ปุ่มกลับหน้าหลัก */
        .btn-back-pastel {
            display: inline-block;
            padding: 8px 20px;
            background: #ffffff;
            color: #4a5568;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .btn-back-pastel:hover {
            background: #fff0f3;
            color: #ff5277;
        }

        /* สไตล์ตารางแบบแนวนอน */
        .table-responsive {
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .admin-table th {
            background: #f8fafc;
            color: #475569;
            padding: 14px;
            font-size: 14px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
        }

        .admin-table td {
            padding: 12px 14px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        @media (max-width: 768px) {
            .dashboard-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="pastel-theme">

    <script>
        // ล็อกรหัสผ่านสำหรับแอดมิน
        const adminPassword = prompt("🔒 กรุณากรอกรหัสผ่านสำหรับแอดมิน:");
        if (adminPassword !== "1234") {
            alert("❌ รหัสผ่านไม่ถูกต้อง!");
            window.location.href = "index.html";
        }
    </script>

    <div class="admin-container-horizontal">
        <div class="admin-header">
            <h2 class="admin-title">🔴 สถิติผู้เข้าใช้งาน Real-time (Admin)</h2>
            <a href="index.html" class="btn-back-pastel">⬅️ กลับหน้าหลัก</a>
        </div>

        <!-- การ์ดสรุปสถิติเรียงแนวนอน 3 ช่อง -->
        <div class="dashboard-stats">
            <div class="stat-card">
                <div class="stat-title">👥 ผู้เข้าชมทั้งหมด</div>
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-percent">รายการทั้งหมด</div>
            </div>
            <div class="stat-card mobile">
                <div class="stat-title">📱 เข้าชมผ่านมือถือ</div>
                <div class="stat-number" id="mobileCount">0</div>
                <div class="stat-percent" id="mobilePercent">คิดเป็น 0%</div>
            </div>
            <div class="stat-card desktop">
                <div class="stat-title">💻 เข้าชมผ่านคอมพิวเตอร์</div>
                <div class="stat-number" id="desktopCount">0</div>
                <div class="stat-percent" id="desktopPercent">คิดเป็น 0%</div>
            </div>
        </div>

        <!-- แถบสัดส่วนร้อยละ -->
        <div class="progress-bar-bg">
            <div id="barMobile" class="progress-mobile" style="width: 0%;"></div>
            <div id="barDesktop" class="progress-desktop" style="width: 0%;"></div>
        </div>

        <!-- ตารางประวัติผู้เข้าใช้งาน -->
        <div class="table-responsive">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>เวลา</th>
                        <th>ผู้ใช้งาน</th>
                        <th>อุปกรณ์</th>
                        <th>กิจกรรม</th>
                    </tr>
                </thead>
                <tbody id="realtimeTableBody">
                    <tr><td colspan="4" style="text-align:center;">กำลังเชื่อมต่อฐานข้อมูลสด...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script เชื่อมต่อ Firebase และคำนวณสถิติแบบ Real-time -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      // ⚠️ วาง firebaseConfig ชุดเดียวกับหน้า index.html
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "XXXXX",
        appId: "XXXXX"
      };

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      const logsRef = ref(database, 'user_logs');
      
      // ดึงข้อมูลสด และคำนวณจำนวนคน + คิดเป็นร้อยละ
      onValue(logsRef, (snapshot) => {
        const data = snapshot.val();
        const tableBody = document.getElementById('realtimeTableBody');
        
        if (!data) {
          tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ยังไม่มีข้อมูลผู้เข้าใช้</td></tr>';
          return;
        }

        const logsArray = Object.values(data);
        const total = logsArray.length;

        let mobileCount = 0;
        let desktopCount = 0;

        logsArray.forEach(log => {
          if (log.device && log.device.includes('มือถือ')) {
            mobileCount++;
          } else {
            desktopCount++;
          }
        });

        const mobilePct = total > 0 ? ((mobileCount / total) * 100).toFixed(1) : 0;
        const desktopPct = total > 0 ? ((desktopCount / total) * 100).toFixed(1) : 0;

        document.getElementById('totalUsers').innerText = total + " คน";
        document.getElementById('mobileCount').innerText = mobileCount + " คน";
        document.getElementById('mobilePercent').innerText = `คิดเป็น ${mobilePct}%`;
        document.getElementById('desktopCount').innerText = desktopCount + " คน";
        document.getElementById('desktopPercent').innerText = `คิดเป็น ${desktopPct}%`;

        document.getElementById('barMobile').style.width = `${mobilePct}%`;
        document.getElementById('barDesktop').style.width = `${desktopPct}%`;

        const logList = logsArray.reverse();
        tableBody.innerHTML = logList.map(log => {
          const timeStr = log.timestamp ? new Date(log.timestamp).toLocaleString('th-TH') : 'เมื่อสักครู่';
          return `
            <tr>
              <td>${timeStr}</td>
              <td>${log.user}</td>
              <td>${log.device}</td>
              <td><strong style="color: #2563eb;">${log.action}</strong></td>
            </tr>
          `;
        }).join('');
      });
    </script>
</body>
</html>
