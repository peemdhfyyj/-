<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhumMai - รายชื่อผู้จัดทำ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* สไตล์โทนสีพาสเทลสำหรับหน้าสมาชิก */
        body.pastel-theme {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .members-container-horizontal {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        .members-title {
            color: #4a4a4a;
            font-size: 24px;
            margin-bottom: 25px;
        }

        /* จัดเรียงการ์ดแนวนอน */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
            justify-content: center;
        }

        /* การ์ดแต่ละคน */
        .member-card-pastel {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 2px solid #fff0f5;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .member-card-pastel:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        /* รูปโปรไฟล์วงกลม */
        .member-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fecfef;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .member-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin: 5px 0;
        }

        .member-detail {
            font-size: 13px;
            color: #777;
            margin: 2px 0;
        }

        .btn-back-pastel {
            display: inline-block;
            padding: 8px 18px;
            background: #ffffff;
            color: #555;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: background 0.2s;
        }

        .btn-back-pastel:hover {
            background: #fff5f8;
        }
    </style>
</head>
<body class="pastel-theme">

    <div class="members-container-horizontal">
        <div style="text-align: left; margin-bottom: 10px;">
            <a href="index.html" class="btn-back-pastel">⬅️ กลับหน้าหลัก</a>
        </div>

        <h2 class="members-title">👥 รายชื่อผู้จัดทำ</h2>

        <!-- ตารางแสดงสมาชิกแนวนอน -->
        <div class="members-grid">
            
            <!-- คนที่ 1 -->
            <div class="member-card-pastel">
                <img src="p1.jpg" alt="นาย คมกริช แอ่งมูล" class="member-avatar">
                <div class="member-name">นาย คมกริช แอ่งมูล</div>
                <div class="member-detail">ชั้น ม.5/7</div>
                <div class="member-detail">เลขที่ 4</div>
            </div>

            <!-- คนที่ 2 -->
            <div class="member-card-pastel">
                <img src="p2.jpg" alt="นาย ธนภัทร มีเพียร" class="member-avatar">
                <div class="member-name">นาย ธนภัทร มีเพียร</div>
                <div class="member-detail">ชั้น ม.5/7</div>
                <div class="member-detail">เลขที่ 7</div>
            </div>

            <!-- คนที่ 3 -->
            <div class="member-card-pastel">
                <img src="p3.jpg" alt="นาย นพเก้า นางัว" class="member-avatar">
                <div class="member-name">นาย นพเก้า นางัว</div>
                <div class="member-detail">ชั้น ม.5/7</div>
                <div class="member-detail">เลขที่ 11</div>
            </div>

            <!-- คนที่ 4 -->
            <div class="member-card-pastel">
                <img src="p4.jpg" alt="นางสาว ธัญพร หาญคำ" class="member-avatar">
                <div class="member-name">นางสาว ธัญพร หาญคำ</div>
                <div class="member-detail">ชั้น ม.5/7</div>
                <div class="member-detail">เลขที่ 23</div>
            </div>

            <!-- คนที่ 5 -->
            <div class="member-card-pastel">
                <img src="p5.jpg" alt="นางสาว ณีรนุช ทนาพันธ์" class="member-avatar">
                <div class="member-name">นางสาว ณีรนุช ทนาพันธ์</div>
                <div class="member-detail">ชั้น ม.5/7</div>
                <div class="member-detail">เลขที่ 31</div>
            </div>

        </div>
    </div>

    <!-- Script สำหรับเก็บบันทึกการเข้าชมลง LocalStorage -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            recordAccess('เข้าชมหน้ารายชื่อสมาชิก');
        });

        function recordAccess(action) {
            let logs = JSON.parse(localStorage.getItem('khummai_logs')) || [];
            const newLog = {
                user: 'ผู้ใช้งานทั่วไป',
                action: action,
                time: new Date().toLocaleString('th-TH')
            };
            logs.unshift(newLog);
            localStorage.setItem('khummai_logs', JSON.stringify(logs));
        }
    </script>
</body>
</html>
