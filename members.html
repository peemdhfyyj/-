<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhumMai - รายชื่อผู้จัดทำ ม.5/7</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

        body.pastel-theme {
            background: linear-gradient(135deg, #ffb199 0%, #ff0844 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* กล่องหลักแบบแนวนอน กว้างเต็มตา */
        .members-container-horizontal {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 35px 30px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 1200px;
            width: 95%;
            text-align: center;
        }

        .members-title {
            color: #2d3748;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* จัดเรียงการ์ดแนวนอนด้วย Grid Responsive */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        /* การ์ดแต่ละคน */
        .member-card-pastel {
            background: #ffffff;
            border-radius: 22px;
            padding: 25px 15px;
            box-shadow: 0 8px 20px rgba(255, 105, 135, 0.08);
            border: 1px solid rgba(255, 192, 203, 0.4);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .member-card-pastel:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(255, 105, 135, 0.2);
        }

        /* กรอบรูปภาพพาสเทลตัดกับการ์ด */
        .avatar-wrapper {
            position: relative;
            padding: 5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #ff80bf 100%);
            box-shadow: 0 6px 15px rgba(161, 196, 253, 0.4);
            margin-bottom: 15px;
        }

        .member-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 3px solid #ffffff;
        }

        /* ลำดับข้อมูล: เลขที่ -> ชื่อ -> ชั้น */
        .member-number {
            font-size: 13px;
            font-weight: 500;
            color: #ff5277;
            background: #fff0f3;
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .member-name {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin: 4px 0;
        }

        .member-class {
            font-size: 13px;
            color: #718096;
            margin-top: 2px;
        }

        .btn-back-pastel {
            display: inline-block;
            padding: 9px 22px;
            background: #ffffff;
            color: #4a5568;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        .btn-back-pastel:hover {
            background: #fff0f3;
            color: #ff5277;
        }
    </style>
</head>
<body class="pastel-theme">

    <div class="members-container-horizontal">
        <div style="text-align: left; margin-bottom: 10px;">
            <a href="index.html" class="btn-back-pastel">⬅️ กลับหน้าหลัก</a>
        </div>

        <h2 class="members-title">👥 รายชื่อผู้จัดทำ ม.5/7</h2>

        <!-- รายการสมาชิกเรียงแนวนอน -->
        <div class="members-grid">
            
            <!-- คนที่ 1 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p1.jpg" alt="นาย คมกริช แอ่งมูล" class="member-avatar">
                </div>
                <div class="member-number">เลขที่ 4</div>
                <div class="member-name">นาย คมกริช แอ่งมูล</div>
                <div class="member-class">ชั้น ม.5/7</div>
            </div>

            <!-- คนที่ 2 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p2.jpg" alt="นาย ธนภัทร มีเพียร" class="member-avatar">
                </div>
                <div class="member-number">เลขที่ 7</div>
                <div class="member-name">นาย ธนภัทร มีเพียร</div>
                <div class="member-class">ชั้น ม.5/7</div>
            </div>

            <!-- คนที่ 3 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p3.jpg" alt="นาย นพเก้า นางัว" class="member-avatar">
                </div>
                <div class="member-number">เลขที่ 11</div>
                <div class="member-name">นาย นพเก้า นางัว</div>
                <div class="member-class">ชั้น ม.5/7</div>
            </div>

            <!-- คนที่ 4 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p4.jpg" alt="นางสาว ธัญพร หาญคำ" class="member-avatar">
                </div>
                <div class="member-number">เลขที่ 23</div>
                <div class="member-name">นางสาว ธัญพร หาญคำ</div>
                <div class="member-class">ชั้น ม.5/7</div>
            </div>

            <!-- คนที่ 5 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p5.jpg" alt="นางสาว ณีรนุช ทนาพันธ์" class="member-avatar">
                </div>
                <div class="member-number">เลขที่ 31</div>
                <div class="member-name">นางสาว ณีรนุช ทนาพันธ์</div>
                <div class="member-class">ชั้น ม.5/7</div>
            </div>

        </div>
    </div>

    <!-- Script เก็บบันทึกประวัติลง LocalStorage -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            recordAccess('เข้าชมหน้ารายชื่อสมาชิก');
        });

        function recordAccess(action) {
            let logs = JSON.parse(localStorage.getItem('khummai_logs')) || [];
            const newLog = {
                user: 'ผู้ใช้งานทั่วไป',
                action: action,
                time: new Date().toLocaleString('th-TH')
            };
            logs.unshift(newLog);
            localStorage.setItem('khummai_logs', JSON.stringify(logs));
        }
    </script>
</body>
</html>
