<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhumMai - รายชื่อผู้จัดทำ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%) !important;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* ขยายกล่องการ์ดหลักให้กว้างแนวนอน */
        .members-container, 
        .members-container-horizontal {
            background: #ffffff !important;
            padding: 35px 25px !important;
            border-radius: 28px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08) !important;
            max-width: 1050px !important;
            width: 95% !important;
            text-align: center !important;
            margin: 0 auto !important;
        }

        .members-title {
            color: #2d3748;
            font-size: 24px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* บังคับการจัดเรียง 5 ช่องแนวนอน */
        .members-grid {
            display: flex !important;
            flex-direction: row !important;
            justify-content: center !important;
            align-items: stretch !important;
            gap: 12px !important;
            flex-wrap: nowrap !important;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        /* การ์ดแต่ละคนแบบแคบลงเพื่อให้ลงครบ 5 คน */
        .member-card-pastel {
            background: #fafafa;
            border-radius: 18px;
            padding: 18px 8px;
            flex: 1;
            min-width: 150px;
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        .member-card-pastel:hover {
            transform: translateY(-4px);
            background: #ffffff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        /* กรอบรูปภาพพาสเทล */
        .avatar-wrapper {
            padding: 4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a1c4fd 0%, #fecfef 100%);
            margin-bottom: 12px;
        }

        .member-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 2px solid #ffffff;
        }

        .member-number {
            font-size: 13px;
            font-weight: 600;
            color: #ff6b81;
            margin-bottom: 4px;
        }

        .member-name {
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin: 2px 0;
            line-height: 1.3;
        }

        .member-class {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
        }

        /* ปุ่มกลับหน้าหลักทรงแคปซูลสีชมพูอยู่ด้านล่าง */
        .btn-back-bottom {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #ffffff;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.3);
            transition: opacity 0.2s;
        }

        .btn-back-bottom:hover {
            opacity: 0.9;
        }

        /* สไตล์รองรับมือถือถ้าน้องเปิดในจอเล็กมากๆ */
        @media (max-width: 768px) {
            .members-grid {
                flex-wrap: wrap !important;
            }
            .member-card-pastel {
                min-width: 130px;
            }
        }
    </style>
</head>
<body>

    <div class="members-container-horizontal">
        <h2 class="members-title">👥 สมาชิกผู้จัดทำ ม.5/7</h2>

        <!-- การ์ด 5 คนเรียงแนวนอน -->
        <div class="members-grid">
            
            <!-- คนที่ 1 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p1.jpg" alt="นาย คมกริช แอ่งมูล" class="member-avatar">
                </div>
                <div class="member-number">1.</div>
                <div class="member-name">นาย คมกริช แอ่งมูล</div>
                <div class="member-class">ม.5/7 | เลขที่ 4</div>
            </div>

            <!-- คนที่ 2 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p2.jpg" alt="นาย ธนภัทร มีเพียร" class="member-avatar">
                </div>
                <div class="member-number">2.</div>
                <div class="member-name">นาย ธนภัทร มีเพียร</div>
                <div class="member-class">ม.5/7 | เลขที่ 7</div>
            </div>

            <!-- คนที่ 3 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p3.jpg" alt="นาย นพเก้า นางัว" class="member-avatar">
                </div>
                <div class="member-number">3.</div>
                <div class="member-name">นาย นพเก้า นางัว</div>
                <div class="member-class">ม.5/7 | เลขที่ 11</div>
            </div>

            <!-- คนที่ 4 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p4.jpg" alt="นางสาว ธัญพร หาญคำ" class="member-avatar">
                </div>
                <div class="member-number">4.</div>
                <div class="member-name">นางสาว ธัญพร หาญคำ</div>
                <div class="member-class">ม.5/7 | เลขที่ 23</div>
            </div>

            <!-- คนที่ 5 -->
            <div class="member-card-pastel">
                <div class="avatar-wrapper">
                    <img src="p5.jpg" alt="นางสาว ณีรนุช ทนาพันธ์" class="member-avatar">
                </div>
                <div class="member-number">5.</div>
                <div class="member-name">นางสาว ณีรนุช ทนาพันธ์</div>
                <div class="member-class">ม.5/7 | เลขที่ 31</div>
            </div>

        </div>

        <!-- ปุ่มกลับหน้าหลักตรงกลางด้านล่าง -->
        <div>
            <a href="index.html" class="btn-back-bottom">🏠 กลับหน้าหลัก</a>
        </div>
    </div>

    <!-- Script สำหรับเก็บบันทึกประวัติการเข้าชม -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            recordAccess('เข้าชมหน้ารายชื่อสมาชิก');
        });

        function recordAccess(action) {
            let logs = JSON.parse(localStorage.getItem('khummai_logs')) || [];
            const newLog = {
                user: 'ผู้ใช้งานทั่วไป',
                action: action,
                time: new Date().toLocaleString('th-TH')
            };
            logs.unshift(newLog);
            localStorage.setItem('khummai_logs', JSON.stringify(logs));
        }
    </script>
</body>
</html>
