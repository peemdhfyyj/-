<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhumMai - ระบบเปรียบเทียบราคาสินค้า</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-card">
        <!-- โลโก้ & ปุ่มไปหน้าสมาชิก -->
        <div class="logo-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
        </div>

        <div class="title-row">
            <h1 class="title">KhumMai</h1>
            <a href="members.html" class="btn-members">👥 สมาชิก</a>
        </div>
        <p class="subtitle">ระบบเปรียบเทียบราคาและปริมาณสินค้าคุ้มค่าที่สุด</p>

        <!-- กรอบสินค้า A และ B -->
        <div class="product-container">
            <!-- สินค้า A -->
            <div class="box" id="boxA">
                <div class="badge-winner">คุ้มสุด!</div>
                <h3>📦 สินค้า A</h3>
                <label for="priceA">ราคา (บาท):</label>
                <input type="number" id="priceA" placeholder="เช่น 50" step="any">

                <label for="amountA">ปริมาณ:</label>
                <div class="input-group">
                    <input type="number" id="amountA" placeholder="เช่น 500" step="any">
                    <select id="unitA">
                        <option value="g">กรัม (g)</option>
                        <option value="kg">กิโลกรัม (kg)</option>
                        <option value="ml">มิลลิลิตร (ml)</option>
                        <option value="l">ลิตร (L)</option>
                        <option value="pcs">ชิ้น/ซอง</option>
                    </select>
                </div>
            </div>

            <!-- สินค้า B -->
            <div class="box" id="boxB">
                <div class="badge-winner">คุ้มสุด!</div>
                <h3>📦 สินค้า B</h3>
                <label for="priceB">ราคา (บาท):</label>
                <input type="number" id="priceB" placeholder="เช่น 90" step="any">

                <label for="amountB">ปริมาณ:</label>
                <div class="input-group">
                    <input type="number" id="amountB" placeholder="เช่น 1000" step="any">
                    <select id="unitB">
                        <option value="g">กรัม (g)</option>
                        <option value="kg">กิโลกรัม (kg)</option>
                        <option value="ml">มิลลิลิตร (ml)</option>
                        <option value="l">ลิตร (L)</option>
                        <option value="pcs">ชิ้น/ซอง</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- กล่องแสดงผลลัพธ์ -->
        <div id="result-summary"></div>

        <!-- ปุ่มคำนวณ -->
        <button id="calcBtn" onclick="calculate()">⚡ เปรียบเทียบความคุ้มค่า</button>
    </div>

    <!-- Script คำนวณความคุ้มค่า -->
    <script>
        function calculate() {
            const priceA = parseFloat(document.getElementById('priceA').value);
            const amountA = parseFloat(document.getElementById('amountA').value);
            const unitA = document.getElementById('unitA').value;

            const priceB = parseFloat(document.getElementById('priceB').value);
            const amountB = parseFloat(document.getElementById('amountB').value);
            const unitB = document.getElementById('unitB').value;

            const boxA = document.getElementById('boxA');
            const boxB = document.getElementById('boxB');
            const summary = document.getElementById('result-summary');

            boxA.classList.remove('winner-card');
            boxB.classList.remove('winner-card');
            summary.style.display = 'none';

            if (!priceA || !amountA || !priceB || !amountB) {
                alert('กรุณากรอกราคาและปริมาณของทั้งสองสินค้าให้ครบถ้วนครับ');
                return;
            }

            let normalizedA = amountA;
            let normalizedB = amountB;

            if (unitA === 'kg' || unitA === 'l') normalizedA = amountA * 1000;
            if (unitB === 'kg' || unitB === 'l') normalizedB = amountB * 1000;

            const unitPriceA = priceA / normalizedA;
            const unitPriceB = priceB / normalizedB;

            summary.style.display = 'block';

            if (unitPriceA < unitPriceB) {
                boxA.classList.add('winner-card');
                const diff = (((unitPriceB - unitPriceA) / unitPriceB) * 100).toFixed(1);
                summary.innerHTML = `🎉 <strong>สินค้า A คุ้มค่ากว่า!</strong> ประหยัดได้ประมาณ <strong>${diff}%</strong>`;
                summary.style.background = '#e8f5e9';
                summary.style.color = '#2e7d32';
                summary.style.borderColor = '#a5d6a7';
            } else if (unitPriceB < unitPriceA) {
                boxB.classList.add('winner-card');
                const diff = (((unitPriceA - unitPriceB) / unitPriceA) * 100).toFixed(1);
                summary.innerHTML = `🎉 <strong>สินค้า B คุ้มค่ากว่า!</strong> ประหยัดได้ประมาณ <strong>${diff}%</strong>`;
                summary.style.background = '#fff0f3';
                summary.style.color = '#c2185b';
                summary.style.borderColor = '#ff80ab';
            } else {
                summary.innerHTML = `⚖️ <strong>ทั้งสองสินค้ามีราคาและความคุ้มค่าเท่ากันครับ!</strong>`;
                summary.style.background = '#e3f2fd';
                summary.style.color = '#1565c0';
                summary.style.borderColor = '#90caf9';
            }
        }
    </script>
</body>
</html>
