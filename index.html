<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khum Mai?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-card">
        <div class="header-container">
            <div class="logo-box">
                <svg viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                </svg>
            </div>
            
            <div class="title-row">
                <h1 class="title">Khum Mai?</h1>
                <a href="members.html" class="btn-members">👥 สมาชิก</a>
            </div>
            <p class="subtitle">Check unit price, auto convert units ✨</p>
        </div>

        <div class="product-container">
            <!-- สินค้า A -->
            <div id="boxA" class="box">
                <h3>📦 สินค้า A</h3>
                <label>ราคารวม (บาท)</label>
                <input type="number" id="priceA" placeholder="เช่น 120" step="any">

                <label>จำนวนชิ้น/ซอง</label>
                <input type="number" id="piecesA" placeholder="1" value="1" step="any">

                <label>ปริมาณต่อชิ้น</label>
                <div class="input-group">
                    <input type="number" id="unitA" placeholder="เช่น 1.5" step="any">
                    <select id="typeA">
                        <option value="g">กรัม (g)</option>
                        <option value="kg">กิโลกรัม (kg)</option>
                        <option value="ml">มิลลิลิตร (ml)</option>
                        <option value="l">ลิตร (L)</option>
                    </select>
                </div>
                <div id="resultA" class="unit-result"></div>
            </div>

            <!-- สินค้า B -->
            <div id="boxB" class="box">
                <h3>🎁 สินค้า B</h3>
                <label>ราคารวม (บาท)</label>
                <input type="number" id="priceB" placeholder="เช่น 100" step="any">

                <label>จำนวนชิ้น/ซอง</label>
                <input type="number" id="piecesB" placeholder="1" value="1" step="any">

                <label>ปริมาณต่อชิ้น</label>
                <div class="input-group">
                    <input type="number" id="unitB" placeholder="เช่น 500" step="any">
                    <select id="typeB">
                        <option value="g">กรัม (g)</option>
                        <option value="kg">กิโลกรัม (kg)</option>
                        <option value="ml">มิลลิลิตร (ml)</option>
                        <option value="l">ลิตร (L)</option>
                    </select>
                </div>
                <div id="resultB" class="unit-result"></div>
            </div>
        </div>

        <button onclick="calculateComparison()">⚡ คำนวณเปรียบเทียบเลย</button>
        <div id="finalResult" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
